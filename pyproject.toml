[project]
name = "chess-app"
version = "0.1.0"
description = "Chess engine, bots, GUI, game review and analysis tools written from scratch in Python."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
gui = ["pygame-ce>=2.5.8"]
dl = [
    "numpy>=1.26",
    "torch>=2.3",
]
all = ["chess-app[gui,dl]"]

[project.scripts]
chess-review = "review.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chess", "bot", "ui", "tools", "review", "motifs"]

[tool.uv]
required-environments = ["sys_platform == 'win32' and platform_machine == 'ARM64'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'win32' and platform_machine == 'ARM64'" },
]

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"bot/advanced_evaluation.py" = ["SIM110"]

[tool.ruff.lint.isort]
known-first-party = ["chess", "bot", "ui", "tools", "review", "motifs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true